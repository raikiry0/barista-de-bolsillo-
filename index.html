<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barista de Bolsillo</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1C1108">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1C1108;
    --bg-soft: #2A190E;
    --paper: #F3E7D2;
    --paper-dim: #E9D9BC;
    --ink: #2A1B0F;
    --ink-soft: #6B5A45;
    --amber: #B0692B;
    --olive: #6E7A4C;
    --line: rgba(243,231,210,0.14);
    --shadow: 0 18px 40px rgba(0,0,0,0.35);
    --text-main: #F3E7D2;
  }

  /* Tema 3: Estándar (café espresso oscuro) — el mismo de siempre */
  html[data-theme="standard"]{
    --bg: #1C1108; --bg-soft: #2A190E; --paper: #F3E7D2; --paper-dim: #E9D9BC;
    --ink: #2A1B0F; --ink-soft: #6B5A45; --amber: #B0692B; --olive: #6E7A4C;
    --line: rgba(243,231,210,0.14); --shadow: 0 18px 40px rgba(0,0,0,0.35);
    --text-main: #F3E7D2;
  }

  /* Tema 1: Claro (modo día, sol) */
  html[data-theme="light"]{
    --bg: #FAF3E6; --bg-soft: #F0E4CE; --paper: #FFFFFF; --paper-dim: #F3E7D2;
    --ink: #2A1B0F; --ink-soft: #8A7860; --amber: #B0692B; --olive: #6E7A4C;
    --line: rgba(42,27,15,0.12); --shadow: 0 10px 24px rgba(60,40,20,0.10);
    --text-main: #2A1B0F;
  }

  /* Tema 2: Oscuro (modo noche, luna) — gris carbón, distinto del espresso cálido */
  html[data-theme="dark"]{
    --bg: #15171A; --bg-soft: #1F2226; --paper: #ECE7DE; --paper-dim: #DED7C9;
    --ink: #20211F; --ink-soft: #665F55; --amber: #C98A4A; --olive: #748265;
    --line: rgba(236,231,222,0.12); --shadow: 0 18px 40px rgba(0,0,0,0.45);
    --text-main: #ECE7DE;
  }

  /* Tema 4: Latte (café con leche, tonos crema y caramelo) */
  html[data-theme="latte"]{
    --bg: #3E2A20; --bg-soft: #4E3A2C; --paper: #FBEFD9; --paper-dim: #F0DFC0;
    --ink: #3E2A20; --ink-soft: #7A6450; --amber: #D9A05B; --olive: #8C9B6E;
    --line: rgba(251,239,217,0.16); --shadow: 0 18px 40px rgba(0,0,0,0.3);
    --text-main: #FBEFD9;
  }

  /* Tema 5: Mocha (chocolate profundo con acento terracota) */
  html[data-theme="mocha"]{
    --bg: #241014; --bg-soft: #331821; --paper: #F5E3DA; --paper-dim: #E8CFC0;
    --ink: #2E1712; --ink-soft: #7A5A52; --amber: #C1553D; --olive: #7A6A45;
    --line: rgba(245,227,218,0.14); --shadow: 0 18px 40px rgba(0,0,0,0.4);
    --text-main: #F5E3DA;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #2A190E 0%, transparent 45%),
      var(--bg);
    color: var(--text-main);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }
  #app{
    width:100%;
    max-width:420px;
  }

  /* --- Textura de grano: franja firma de la marca --- */
  .grind-strip{
    display:flex;
    height:10px;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:22px;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .grind-strip span{flex:1;}
  .grind-strip .g1{background:radial-gradient(circle, #cbb489 1px, transparent 1.4px) 0 0/4px 4px, #4a3520;}
  .grind-strip .g2{background:radial-gradient(circle, #cbb489 1.4px, transparent 1.8px) 0 0/7px 7px, #4a3520;}
  .grind-strip .g3{background:radial-gradient(circle, #cbb489 2px, transparent 2.6px) 0 0/11px 11px, #4a3520;}
  .grind-strip .g4{background:radial-gradient(circle, #cbb489 3px, transparent 3.8px) 0 0/16px 16px, #4a3520;}

  header{margin-bottom: 28px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--amber);
    margin:0 0 8px;
  }
  .logo-mark{
    display:block;
    width:64px;
    height:64px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 34px;
    line-height:1.05;
    margin:0 0 10px;
    color: var(--text-main);
  }
  header p{
    font-size:15px;
    line-height:1.5;
    color: #C9B9A0;
    margin:0;
    max-width: 34ch;
  }

  .screen{display:none;}
  .screen.active{display:block; animation: rise .45s ease both;}
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .step-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#8a7860;
    letter-spacing:0.08em;
    margin-bottom:14px;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }
  .brewer-card{
    background: var(--paper);
    color: var(--ink);
    border-radius: 18px;
    padding: 18px 14px 16px;
    text-align:left;
    border: none;
    cursor:pointer;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition: transform .18s ease, box-shadow .18s ease;
    font-family: inherit;
  }
  .brewer-card:hover{ transform: translateY(-4px); }
  .brewer-card:active{ transform: translateY(-1px) scale(0.98); }
  .brewer-card svg{ width:40px; height:40px; }
  .brewer-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    line-height:1.15;
  }
  .brewer-sub{
    font-size:12.5px;
    color: var(--ink-soft);
    line-height:1.35;
  }

  .footnote{
    margin-top:26px;
    font-size:12px;
    color:#8a7860;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }

  .progress-shell{
    position:relative;
    max-width:420px;
    width:100%;
    margin:0 auto 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#8a7860;
    display:flex;
    justify-content:space-between;
  }

  .back-btn{
    background:none;
    border:1px solid var(--line);
    color:#C9B9A0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:16px;
  }
  .back-btn:hover{ border-color: var(--amber); color: var(--amber); }

  .brewer-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--olive);
    background: rgba(110,122,76,0.14);
    border:1px solid rgba(110,122,76,0.4);
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:18px;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    margin: 0 0 14px;
    color: var(--text-main);
  }

  .size-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:26px;
  }
  .size-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .size-option:hover{ border-color: var(--amber); }
  .size-option.selected{
    border-color: var(--amber);
    background: rgba(176,105,43,0.16);
  }
  .size-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
  }
  .size-ml{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#C9B9A0;
  }

  .intensity-row{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }
  .intensity-option{
    flex:1;
    text-align:center;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 8px;
    cursor:pointer;
    font-size:13.5px;
    color:#C9B9A0;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .intensity-option .dot{
    width:10px; height:10px; border-radius:50%;
    background:#5a4a38; margin:0 auto 8px;
  }
  .intensity-option:hover{ border-color: var(--amber); }
  .intensity-option.selected{
    border-color: var(--amber);
    background: rgba(176,105,43,0.16);
    color: var(--text-main);
  }
  .intensity-option.selected .dot{ background: var(--amber); }

  .next-btn{
    width:100%;
    background: var(--amber);
    color:#1C1108;
    border:none;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:15px;
    border-radius:14px;
    cursor:pointer;
    opacity:0.45;
    pointer-events:none;
    transition: opacity .2s ease;
  }
  .next-btn.enabled{ opacity:1; pointer-events:auto; }
  .next-btn:hover.enabled{ filter:brightness(1.08); }

  .choice-row{
    display:flex;
    gap:10px;
    margin-bottom: 22px;
  }
  .choice-option{
    flex:1;
    text-align:center;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 10px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .choice-option:hover{ border-color: var(--amber); }
  .choice-option.selected{
    border-color: var(--amber);
    background: rgba(176,105,43,0.16);
  }
  .choice-icon{ font-size:26px; margin-bottom:8px; }
  .choice-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
  }

  .grind-card{
    background: var(--paper);
    color: var(--ink);
    border-radius:18px;
    padding:20px;
    margin-bottom:22px;
    box-shadow: var(--shadow);
  }
  .grind-level{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--amber);
    margin-bottom:6px;
  }
  .grind-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:22px;
    margin-bottom:12px;
  }
  .grind-texture{
    font-size:14px;
    line-height:1.55;
    color: var(--ink-soft);
  }
  .grind-texture b{ color: var(--ink); }

  .result-card{
    background: var(--paper);
    color: var(--ink);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
    box-shadow: var(--shadow);
  }
  .result-brewer{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--amber);
    margin-bottom:4px;
  }
  .result-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:22px;
    margin-bottom:18px;
  }
  .result-numbers{
    display:flex;
    gap:12px;
    margin-bottom:6px;
  }
  .result-num-box{
    flex:1;
    background: var(--paper-dim);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
  }
  .result-num-value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:22px;
    color: var(--ink);
  }
  .result-num-label{
    font-size:11px;
    color: var(--ink-soft);
    margin-top:2px;
  }
  .result-ratio{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: var(--ink-soft);
    text-align:center;
    margin: 12px 0 4px;
  }

  .time-card{
    background: rgba(110,122,76,0.14);
    border: 1px solid rgba(110,122,76,0.4);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .time-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color: var(--olive);
    white-space:nowrap;
  }
  .time-label{
    font-size:13px;
    color:#C9B9A0;
  }

  .tips-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    margin: 0 0 12px;
  }
  .tips-list{
    list-style:none;
    padding:0;
    margin:0 0 26px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .tips-list li{
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.45;
    color:#DDD0BB;
    display:flex;
    gap:10px;
  }
  .tips-list li::before{
    content:"☕";
    flex-shrink:0;
  }

  .go-free-btn{
    width:100%;
    background:none;
    border:1px solid var(--amber);
    color: var(--amber);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .go-free-btn:hover{ background: rgba(176,105,43,0.12); }

  .sensory-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    gap:10px;
  }
  .sensory-label{
    font-size:13.5px;
    color: var(--ink);
    font-weight:500;
    flex-shrink:0;
  }
  .sensory-dots{
    display:flex;
    gap:6px;
  }
  .sensory-dot{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #d8c9ab;
    background: var(--paper-dim);
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .sensory-dot.filled{
    background: var(--olive);
    border-color: var(--olive);
  }
  .sensory-dot:hover{ border-color: var(--olive); }

  .accordion-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg-soft);
    border:1px solid var(--line);
    color: var(--text-main);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    padding:14px 16px;
    border-radius:14px;
    cursor:pointer;
    margin-bottom:10px;
    text-align:left;
  }
  .accordion-header:hover{ border-color: var(--amber); }
  .accordion-chevron{
    font-family:'IBM Plex Mono', monospace;
    color: var(--amber);
    transition: transform .2s ease;
    flex-shrink:0;
    margin-left:10px;
  }
  .accordion-chevron.open{ transform: rotate(180deg); }

  .free-card{
    background: var(--paper);
    color: var(--ink);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow: var(--shadow);
  }
  .free-card-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    margin: 0 0 16px;
  }
  .ratio-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color: var(--ink-soft);
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .ratio-row input{
    width:52px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border:1px solid #d8c9ab;
    border-radius:8px;
    padding:6px 4px;
    background: var(--paper-dim);
    color: var(--ink);
  }
  .calc-fields{
    display:flex;
    gap:12px;
  }
  .calc-field{
    flex:1;
    background: var(--paper-dim);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
  }
  .calc-field label{
    display:block;
    font-size:11px;
    color: var(--ink-soft);
    margin-bottom:6px;
  }
  .calc-field input{
    width:100%;
    border:none;
    background:none;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:22px;
    color: var(--ink);
  }
  .calc-field input:focus{ outline:none; }
  .calc-swap{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color: var(--ink-soft);
  }

  .timer-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .timer-toggle button{
    flex:1;
    background: none;
    border:1px solid var(--line);
    color:#C9B9A0;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    padding:9px;
    border-radius:12px;
    cursor:pointer;
  }
  .timer-toggle button.active{
    border-color: var(--amber);
    background: rgba(176,105,43,0.16);
    color: var(--text-main);
  }
  .countdown-set{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .countdown-set input{
    width:52px;
    text-align:center;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 4px;
    background: var(--bg-soft);
    color: var(--text-main);
  }
  .countdown-set span{ color:#8a7860; font-size:13px; }
  .timer-display{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:52px;
    color: var(--text-main);
    letter-spacing:0.02em;
    margin-bottom:18px;
  }
  .timer-display.done{ color: var(--amber); }
  .timer-controls{
    display:flex;
    gap:10px;
  }
  .timer-controls button{
    flex:1;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:13px;
    border-radius:14px;
    cursor:pointer;
    border:none;
  }
  .timer-start{ background: var(--amber); color:#1C1108; }
  .timer-reset{ background: var(--bg-soft); color:#C9B9A0; border:1px solid var(--line) !important; }

  .custom-point-status{
    margin-top:14px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color: var(--amber);
    background: rgba(176,105,43,0.14);
    border:1px solid rgba(176,105,43,0.4);
    border-radius:12px;
    padding:10px;
  }

  .custom-point-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
    transition: border-color .2s ease, background .2s ease;
  }
  .custom-point-row.active{
    border-color: var(--amber);
    background: rgba(176,105,43,0.16);
  }
  .custom-point-row.done{
    opacity:0.5;
  }
  .custom-point-row input{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 2px;
    background: var(--bg);
    color: var(--text-main);
  }
  .custom-point-row .cp-min, .custom-point-row .cp-sec{ width:34px; }
  .custom-point-row .cp-ml{ width:52px; }
  .custom-point-row .cp-label{ font-size:12px; color:#8a7860; }
  .custom-point-row .cp-remove{
    margin-left:auto;
    background:none;
    border:none;
    color:#8a7860;
    font-size:16px;
    cursor:pointer;
    padding:0 4px;
  }
  .custom-point-row .cp-remove:hover{ color:#C0392B; }

  .saved-recipe-row{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .saved-recipe-main{ flex:1; }
  .saved-recipe-brewer{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    color: var(--text-main);
    margin-bottom:2px;
  }
  .saved-recipe-details{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#C9B9A0;
  }
  .saved-recipe-remove{
    background:none;
    border:none;
    color:#8a7860;
    font-size:18px;
    cursor:pointer;
    padding:0 4px;
  }
  .saved-recipe-remove:hover{ color:#C0392B; }

  #settings-gear{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text-main);
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }
  #settings-gear:hover{ border-color: var(--amber); }

  #settings-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(10,6,3,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #settings-overlay.open{ display:flex; }

  #settings-panel{
    background: var(--paper);
    color: var(--ink);
    border-radius: 20px;
    padding: 24px 22px;
    width: 100%;
    max-width: 340px;
    box-shadow: var(--shadow);
  }
  .settings-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:20px;
    margin: 0 0 18px;
  }
  .settings-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color: var(--ink-soft);
    margin-bottom:10px;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
